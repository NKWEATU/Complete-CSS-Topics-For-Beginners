<!-- What it demonstrates: An element selector targets all HTML elements with a particular tag name.

For example, p selects all paragraph elements. -->
<!DOCTYPE html>
<html>
<head>
    <title>Element Selector</title>

    <!-- Connect the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- School heading -->
<h1>My School</h1>

<!-- Paragraphs about the school -->
<p>Welcome to our school website.</p>

<p>We provide quality education for every student.</p>

<p>Our school has experienced teachers.</p>

</body>
</html>
