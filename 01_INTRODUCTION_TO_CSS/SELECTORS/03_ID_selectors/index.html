
<!-- What it demonstrates: An ID selector targets an HTML element using its unique ID.

An ID selector starts with a hash symbol (#) in CSS. -->
<!DOCTYPE html>
<html>
<head>
    <title>ID Selector</title>

    <!-- Connect the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Main heading with a unique ID -->
<h1 id="heading">Welcome to NIIT</h1>

<!-- Paragraph with a unique ID -->
<p id="description">
    Learn programming and develop practical
    software engineering skills.
</p>

<!-- Button with a unique ID -->
<button id="register">Register Now</button>

</body>
</html>
