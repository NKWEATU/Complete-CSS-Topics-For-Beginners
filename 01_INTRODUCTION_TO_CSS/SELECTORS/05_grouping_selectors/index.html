<!-- What it demonstrates: A grouping selector allows us to apply the same CSS styles to multiple different HTML elements.

Instead of writing separate CSS rules, we separate the selectors with commas.-->
<!DOCTYPE html>
<html>
<head>
    <title>Grouping Selector</title>

    <!-- Connect the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Main heading -->
<h1>About Us</h1>

<!-- Subheading -->
<h2>Our Services</h2>

<!-- Service descriptions -->
<p>Web Development</p>

<p>Software Training</p>

<p>Computer Services</p>

</body>
</html>
