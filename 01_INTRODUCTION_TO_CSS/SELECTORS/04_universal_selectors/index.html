<!-- What it demonstrates: The universal selector targets every HTML element on a webpage.

The universal selector uses the asterisk symbol (*).-->
<!DOCTYPE html>
<html>
<head>
    <title>Universal Selector</title>

    <!-- Connect the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Website heading -->
<h1>My Website</h1>

<!-- Website description -->
<p>Welcome to my personal website.</p>

<!-- Website button -->
<button>Explore More</button>

<!-- Website footer -->
<footer>
    <p>Copyright 2026 My Website</p>
</footer>

</body>
</html>
