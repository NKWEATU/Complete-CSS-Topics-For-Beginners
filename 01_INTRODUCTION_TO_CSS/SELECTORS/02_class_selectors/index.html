<!-- What it demonstrates: A class selector is used to style multiple HTML elements that share the same class name.

A class selector starts with a dot (.) in CSS.-->
<!DOCTYPE html>
<html>
<head>
    <title>Class Selector</title>

    <!-- Connect the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Student Information</h1>

<!-- The student class is used to style this paragraph -->
<p class="student">Student Name: Kennedy</p>

<!-- The course class is used to style this paragraph -->
<p class="course">Course: Software Engineering</p>

<!-- The duration class is used to style this paragraph -->
<p class="duration">Duration: 2 Years</p>

</body>
</html>
