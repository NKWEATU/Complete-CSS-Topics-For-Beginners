<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>

    <!-- Link the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>My Image Gallery</h1>

<div class="gallery">

    <!-- First image -->
    <div class="image-card">
        <img src="https://picsum.photos/id/1015/400/250" alt="Mountain landscape">
        <h3>Mountain View</h3>
    </div>

    <!-- Second image -->
    <div class="image-card">
        <img src="https://picsum.photos/id/1018/400/250" alt="Forest landscape">
        <h3>Beautiful Forest</h3>
    </div>

    <!-- Third image -->
    <div class="image-card">
        <img src="https://picsum.photos/id/1025/400/250" alt="Dog portrait">
        <h3>Animal World</h3>
    </div>

</div>

</body>
</html>
