<!-- Concepts covered: @media, max-width, percentages, width, flex-wrap, and the viewport meta tag. -->
<!DOCTYPE html>
<html>
<head>
    <title>Responsive Student Cards</title>

    <!-- Make the website responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Our Students</h1>

<div class="container">

    <!-- First student -->
    <div class="student-card">
        <h2>John Smith</h2>
        <p>Computer Science</p>
        <p>Level: 200</p>
    </div>

    <!-- Second student -->
    <div class="student-card">
        <h2>Mary Johnson</h2>
        <p>Software Engineering</p>
        <p>Level: 300</p>
    </div>

    <!-- Third student -->
    <div class="student-card">
        <h2>David James</h2>
        <p>Data Science</p>
        <p>Level: 100</p>
    </div>

</div>

</body>
</html>
