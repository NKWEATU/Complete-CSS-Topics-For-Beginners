
<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Advertisement</title>

    <!-- Connect the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Main restaurant advertisement section -->
<div class="restaurant">

    <!-- Restaurant name -->
    <h1>Delicious Kitchen</h1>

    <!-- Restaurant slogan -->
    <h2>Fresh Food, Great Taste</h2>

    <!-- Restaurant description -->
    <p class="description">
        Enjoy delicious meals prepared with
        fresh ingredients and served with love.
    </p>

    <!-- Restaurant offer -->
    <p class="offer">
        Special Discount Available Today!
    </p>

    <!-- Restaurant contact -->
    <p class="contact">
        Visit Us Today
    </p>

</div>

</body>
</html>
