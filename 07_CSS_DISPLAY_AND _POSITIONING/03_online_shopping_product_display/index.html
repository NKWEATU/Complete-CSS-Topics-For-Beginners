<!DOCTYPE html>
<html>
<head>
    <title>Online Shopping Store</title>

    <!-- Connect external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>NKC Online Store</h1>

<p>Choose your favourite products below.</p>

<!-- Product container -->
<div class="product-container">

    <!-- First product -->
    <div class="product-card">

        <span class="sale-label">SALE</span>

        <div class="product-image">
            Laptop Image
        </div>

        <h2>HP Laptop</h2>

        <p>Price: ₦450,000</p>

        <button>Buy Now</button>

    </div>

    <!-- Second product -->
    <div class="product-card">

        <span class="sale-label">NEW</span>

        <div class="product-image">
            Phone Image
        </div>

        <h2>Samsung Phone</h2>

        <p>Price: ₦250,000</p>

        <button>Buy Now</button>

    </div>

    <!-- Third product -->
    <div class="product-card">

        <span class="sale-label">HOT</span>

        <div class="product-image">
            Headphone Image
        </div>

        <h2>Wireless Headphone</h2>

        <p>Price: ₦35,000</p>

        <button>Buy Now</button>

    </div>

</div>

<!-- Fixed shopping message -->
<div class="shopping-message">
    Happy Shopping!
</div>

</body>
</html>
