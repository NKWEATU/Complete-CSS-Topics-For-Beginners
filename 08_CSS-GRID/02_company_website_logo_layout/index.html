<!-- Grid Item Positioning and Spanning-->
<!DOCTYPE html>
<html>
<head>
    <title>Company Website Layout</title>

    <!-- Connect external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Main website grid -->
<div class="website-layout">

    <!-- Website header -->
    <header class="header">
        <h2>NKC TECH</h2>
    </header>

    <!-- Website sidebar -->
    <aside class="sidebar">
        <h3>Menu</h3>

        <p>Dashboard</p>
        <p>About Us</p>
        <p>Services</p>
        <p>Contact</p>
    </aside>

    <!-- Main content -->
    <main class="main-content">

        <h1>Welcome to NKC TECH</h1>

        <p>
            We provide software development,
            ICT training and digital solutions.
        </p>

        <p>
            Learn programming and develop
            practical technology skills.
        </p>

    </main>

    <!-- Additional content -->
    <section class="extra-content">
        <h2>Our Services</h2>
        <p>Software Development</p>
        <p>ICT Training</p>
        <p>Computer Services</p>
    </section>

    <!-- Website footer -->
    <footer class="footer">
        <p>Copyright 2026 NKC TECH</p>
    </footer>

</div>

</body>
</html>
