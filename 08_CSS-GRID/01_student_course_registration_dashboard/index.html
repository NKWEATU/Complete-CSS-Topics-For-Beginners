
<!-- Grid Columns, Rows and Gaps-->
<!DOCTYPE html>
<html>
<head>
    <title>Student Course Dashboard</title>

    <!-- Connect external CSS file -->

</head>
<body>

<h1>Student Course Dashboard</h1>

<!-- Main grid container -->
<div class="course-container">

    <!-- First course -->
    <div class="course-card">
        <h2>HTML</h2>
        <p>Learn the structure of webpages.</p>
    </div>

    <!-- Second course -->
    <div class="course-card">
        <h2>CSS</h2>
        <p>Learn how to style webpages.</p>
    </div>

    <!-- Third course -->
    <div class="course-card">
        <h2>JavaScript</h2>
        <p>Learn how to make webpages interactive.</p>
    </div>

    <!-- Fourth course -->
    <div class="course-card">
        <h2>Python</h2>
        <p>Learn programming with Python.</p>
    </div>

    <!-- Fifth course -->
    <div class="course-card">
        <h2>Java</h2>
        <p>Learn object-oriented programming.</p>
    </div>

    <!-- Sixth course -->
    <div class="course-card">
        <h2>Database</h2>
        <p>Learn how to manage information.</p>
    </div>

</div>

</html>
